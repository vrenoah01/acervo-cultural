<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>LATINA - Register</title>
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./style.css">
</head>
<body class="min-vh-100 d-flex flex-column">

<!-- TopNavBar -->
<header class="w-100 sticky-top z-3 bg-surface border-bottom" style="background-color: var(--surface-color); border-color: var(--outline-variant-color) !important;">
    <div class="d-flex justify-content-between align-items-center w-100 px-3 px-md-5 py-3 py-md-4 max-w-custom mx-auto">
        <a class="font-headline fw-bold text-dark text-decoration-none" style="font-size: clamp(1.75rem, 4vw, 2.25rem); letter-spacing: -0.05em; color: var(--on-surface-color);" href=>
            LATINA
        </a>
    </div>
</header>

<!-- Main Content Canvas -->
<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5 px-3 px-md-5 w-100 max-w-custom mx-auto">
    <div class="w-100" style="max-width: 480px;">
        <div class="text-center mb-4 mb-md-5">
            <h1 class="font-headline fw-semibold text-dark mb-2 mb-md-3 mt-2 mt-md-0" style="font-size: clamp(1.75rem, 4vw, 2.25rem); line-height: 1.2; letter-spacing: -0.02em;">Junte-se ao projeto</h1>
            <p class="text-secondary mb-0" style="color: var(--secondary-color); font-size: clamp(0.95rem, 2vw, 1.125rem); line-height: 1.5;">Um curadoria sobre o patrimônio latino-americano</p>
        </div>
        
        <form class="w-100 d-flex flex-column gap-4">
            <!-- Account Type Selector (Chips) -->
            <fieldset class="d-flex flex-column flex-sm-row gap-2 gap-sm-3 justify-content-center mb-2 w-100 border-0 p-0 m-0">
                <legend class="visually-hidden">Tipo de conta</legend>
                <div class="position-relative w-100">
                    <input checked class="type-radio position-absolute opacity-0 pointer-events-none" id="type-common" name="account_type" type="radio" value="comum">
                    <label class="type-label d-block px-3 py-2 border text-secondary fw-semibold text-center w-100" style="border-color: var(--outline-color); font-size: 0.875rem; min-width: 130px; cursor: pointer; transition: color 0.2s, border-color 0.2s, background-color 0.2s;" for="type-common">
                        Faça seu cadastro aqui!
                    </label>
                </div>
                
            </fieldset>

            <!-- Username Field -->
            <div class="d-flex flex-column gap-1">
                <label class="fw-semibold text-dark" style="font-size: 0.875rem; letter-spacing: 0.02em;" for="username">Nome de Usuário</label>
                <input class="editorial-input w-100 text-dark" id="username" name="username" required type="text">
            </div>

            <!-- Email Field -->
            <div class="d-flex flex-column gap-1">
                <label class="fw-semibold text-dark" style="font-size: 0.875rem; letter-spacing: 0.02em;" for="email">Endereço de Email</label>
                <input class="editorial-input w-100 text-dark" id="email" name="email" required type="email">
            </div>

            <!-- Date of Birth Field -->
            <div class="d-flex flex-column gap-1">
                <label class="fw-semibold text-dark" style="font-size: 0.875rem; letter-spacing: 0.02em;" for="dob">Data de Nascimento</label>
                <input class="editorial-input w-100 text-dark" id="dob" name="dob" required type="date">
            </div>

            <!-- Password Field -->
            <div class="d-flex flex-column gap-1 mb-2">
                <label class="fw-semibold text-dark" style="font-size: 0.875rem; letter-spacing: 0.02em;" for="password">Senha</label>
                <input class="editorial-input w-100 text-dark" id="password" name="password" required type="password">
            </div>

            <!-- Submit Button -->
            <button class="w-100 bg-dark text-white fw-semibold py-3 mt-2 border border-dark text-uppercase" style="letter-spacing: 0.05em; font-size: 0.875rem; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; cursor: pointer;" type="submit">
                Cadastrar
            </button>

            <div class="text-center mt-3">
                <p class="text-secondary mb-0" style="font-size: 0.8125rem; letter-spacing: 0.05em; font-weight: 500;">
                    Already have an account? <a class="text-dark text-decoration-underline footer-link" style="text-underline-offset: 4px;" href="/login">Sign in</a>
                </p>
            </div>
        </form>
    </div>
</main>

<!-- Footer -->
<footer class="w-100 border-top mt-auto" style="background-color: var(--paper-darker); border-color: var(--outline-variant-color) !important;">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center w-100 px-3 px-md-5 py-4 py-md-5 max-w-custom mx-auto gap-4">
        <div class="font-headline fw-semibold text-dark fs-4">
            LATINA
        </div>
        <nav class="d-flex gap-4 flex-wrap" style="font-size: 0.8125rem; font-weight: 500; letter-spacing: 0.05em;">
            <a class="text-secondary text-decoration-none footer-link" href="/archives">Arquivos</a>
            <a class="text-secondary text-decoration-none footer-link" href="/about">Sobre</a>
            <a class="text-secondary text-decoration-none footer-link" href="/submit">Enviar</a>
            <a class="text-secondary text-decoration-none footer-link" href="/legal">Legal</a>
        </nav>
        <div class="text-secondary" style="font-size: 0.8125rem; font-weight: 500; letter-spacing: 0.05em;">
            © 2024 LATINA. An archival lens on Latin American heritage.
        </div>
    </div>
</footer>

<!-- Bootstrap 5.3.3 JS Bundle -->
<script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
